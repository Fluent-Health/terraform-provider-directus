name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned so a new linter release can't fail CI on unchanged code.
          version: v2.12.2

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./... -count=1

  # Generated docs must match the schema.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.12.1"
          terraform_wrapper: false
      - run: go generate ./...
      - name: Fail on drift
        run: git diff --exit-code -- docs examples

  acceptance:
    needs: [lint, unit]
    uses: ./.github/workflows/acceptance.yml
